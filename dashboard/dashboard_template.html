// ---------- reading the totals ----------
// A number from one team's point of view: its average over all games, in the games team s won and in the ones it lost
function simRead(acc, s, sums, squares) {       // sums: [total when the first team won, total when the second did]
  const n = acc.tally[0], wins = acc.tally[1 + s], losses = n - wins, mean = (sums[0] + sums[1]) / n;
  return { mean, sd: squares == null ? null : Math.sqrt(Math.max(0, squares / n - mean * mean)),
           won: wins ? sums[s] / wins : null, lost: losses ? sums[1 - s] / losses : null };
}
const simPlayerStat = (acc, s, side, i, k) => {     // k: 0 points, 1 rebounds, 2 assists
  const out = acc.sides[side], count = out.square.length;
  return simRead(acc, s, [out.split[i * 3 + k], out.split[(count + i) * 3 + k]], k === 0 ? out.square[i] : null);
};
const simTeamStat = (acc, s, side, k) => simRead(acc, s, [acc.sides[side].team[k], acc.sides[side].team[5 + k]], acc.sides[side].teamSquare[k]);
// how often team s wins the games where this player scores at least (or at most) this many
function simWinsWhen(acc, s, side, i, bar, atLeast) {
  const out = acc.sides[side], count = out.square.length, games = [0, 0];
  for (let o = 0; o < 2; o++) for (let points = atLeast ? bar : 0; points <= (atLeast ? 63 : bar); points++) games[o] += out.hist[(o * count + i) * 64 + points];
  return { games: games[0] + games[1], rate: games[0] + games[1] ? games[s] / (games[0] + games[1]) : null };
}

function simReasons(acc, units, s) {
  const T = units[s].t, X = units[1 - s].t, found = [];
  const player = (side, i) => {
    const name = units[side].players[i].name, pts = simPlayerStat(acc, s, side, i, 0);
    if (pts.sd < 0.5) return;
    if (side === s) {
      const reb = simPlayerStat(acc, s, side, i, 1), ast = simPlayerStat(acc, s, side, i, 2);
      const bar = Math.round(pts.mean + 0.8 * pts.sd), when = simWinsWhen(acc, s, side, i, bar, true);
      found.push([(pts.won - pts.lost) / pts.sd, 'mine', `<b>${esc(name)} has a big game.</b> He averages ${pts.won.toFixed(1)} points, ${reb.won.toFixed(1)} rebounds and ${ast.won.toFixed(1)} assists when ${esc(T.name)} wins, and ${pts.lost.toFixed(1)} points when it loses.` +
        (when.games >= 20 ? ` ${esc(T.name)} wins ${(100 * when.rate).toFixed(0)}% of the games where he scores ${bar} or more.` : '')]);
    } else {
      const bar = Math.round(pts.mean - 0.8 * pts.sd), when = simWinsWhen(acc, s, side, i, bar, false);
      found.push([(pts.lost - pts.won) / pts.sd, 'theirs', `<b>${esc(name)} gets shut down.</b> ${esc(T.name)} holds him to ${pts.won.toFixed(1)} points in its wins; he scores ${pts.lost.toFixed(1)} when ${esc(X.name)} wins.` +
        (bar >= 1 && when.games >= 20 ? ` ${esc(T.name)} wins ${(100 * when.rate).toFixed(0)}% of the games where he is held to ${bar} or fewer.` : '')]);
    }
  };
  for (const side of [s, 1 - s]) for (let i = 0; i < Math.min(6, units[side].count); i++) player(side, i);
  const team = (side, k, flip, text) => {
    const v = simTeamStat(acc, s, side, k);
    if (v.sd > 0) found.push([(flip ? -1 : 1) * (v.won - v.lost) / v.sd, 'team', text(v)]);
  };
  const threes = (side, which) => { const made = simTeamStat(acc, s, side, 0), tried = simTeamStat(acc, s, side, 1); return tried[which] ? (100 * made[which] / tried[which]).toFixed(0) + '%' : '–'; };
  team(s, 0, false, v => `<b>The threes fall.</b> ${esc(T.name)} makes ${v.won.toFixed(1)} threes (${threes(s, 'won')}) in its wins and ${v.lost.toFixed(1)} (${threes(s, 'lost')}) in its losses.`);
  team(1 - s, 0, true, v => `<b>It guards the arc.</b> ${esc(X.name)} makes ${v.won.toFixed(1)} threes (${threes(1 - s, 'won')}) when ${esc(T.name)} wins and ${v.lost.toFixed(1)} (${threes(1 - s, 'lost')}) when ${esc(T.name)} loses.`);
  team(s, 2, true, v => `<b>It takes care of the ball.</b> ${esc(T.name)} turns it over ${v.won.toFixed(1)} times in wins, ${v.lost.toFixed(1)} in losses.`);
  team(1 - s, 2, false, v => `<b>It forces mistakes.</b> ${esc(X.name)} turns it over ${v.won.toFixed(1)} times when ${esc(T.name)} wins, ${v.lost.toFixed(1)} when it loses.`);
  team(s, 3, false, v => `<b>It wins the offensive glass.</b> ${esc(T.name)} grabs ${v.won.toFixed(1)} offensive rebounds in wins, ${v.lost.toFixed(1)} in losses.`);
  team(s, 4, false, v => `<b>It lives at the line.</b> ${esc(T.name)} makes ${v.won.toFixed(1)} free throws in wins, ${v.lost.toFixed(1)} in losses.`);
  found.sort((x, y) => y[0] - x[0]);
  const kept = [], used = { mine: 0, theirs: 0, team: 0 }, most = { mine: 2, theirs: 2, team: 3 };
  for (const [size, kind, text] of found) {
    if (kept.length >= 5 || size < 0.12 || used[kind] >= most[kind]) continue;
    used[kind]++; kept.push(text);
  }
  return kept;
}
// when one team wins nearly every game there are too few losses to compare with: say plainly what the games looked like
function simDescribe(acc, units, s) {
  const n = acc.tally[0], T = units[s].t, X = units[1 - s].t, out = [];
  const per = (i, k) => acc.sides[s].box[i * SIM_STATS + k] / n, average = (side, k) => simTeamStat(acc, s, side, k).mean;
  const top = [...Array(units[s].count).keys()].sort((x, y) => per(y, 0) - per(x, 0))[0];
  out.push(`<b>${esc(units[s].players[top].name)} leads the way.</b> ${per(top, 0).toFixed(1)} points, ${per(top, 1).toFixed(1)} rebounds and ${per(top, 2).toFixed(1)} assists a game.`);
  const edge = (k, better, title, text) => {
    const mine = average(s, k), theirs = average(1 - s, k);
    if (better * (mine - theirs) >= 1) out.push(`<b>${title}</b> ${text(mine.toFixed(1), theirs.toFixed(1))}`);
  };
  edge(0, 1, 'More threes.', (m, t) => `${esc(T.name)} makes ${m} a game to ${esc(X.name)}’s ${t}.`);
  edge(2, -1, 'Fewer turnovers.', (m, t) => `${esc(T.name)} turns it over ${m} times a game; ${esc(X.name)} ${t}.`);
  edge(3, 1, 'Second chances.', (m, t) => `${esc(T.name)} grabs ${m} offensive rebounds a game to ${esc(X.name)}’s ${t}.`);
  edge(4, 1, 'Free points.', (m, t) => `${esc(T.name)} makes ${m} free throws a game to ${esc(X.name)}’s ${t}.`);
  return out;
}

function simBoxTable(acc, units, s) {
  const n = acc.tally[0], box = acc.sides[s].box, show = v => v.toFixed(1);
  const total = new Float64Array(SIM_STATS);
  const rows = units[s].players.map((x, i) => {
    const v = [...box.subarray(i * SIM_STATS, (i + 1) * SIM_STATS)].map(value => value / n);
    v.forEach((value, k) => total[k] += value);
    if (x.min < 1) return '';      // the end of the bench still counts in the team line
    return `<tr><td class="l">${playerLink(x.p)}</td><td>${x.min.toFixed(1)}</td><td><b>${show(v[0])}</b></td><td>${show(v[1])}</td><td>${show(v[2])}</td><td>${show(v[3])}</td><td>${show(v[4])}</td><td>${show(v[5])}</td>` +
      `<td>${show(v[6])}-${show(v[7])}</td><td>${show(v[8])}-${show(v[9])}</td><td>${show(v[10])}-${show(v[11])}</td></tr>`;
  }).join('');
  const pct = (made, tried) => total[tried] ? ` <small>${(100 * total[made] / total[tried]).toFixed(0)}%</small>` : '';
  const head = ['Min', 'Pts', 'Reb', 'Ast', 'Stl', 'Blk', 'TO', 'FG', '3P', 'FT'].map(h => `<th><button disabled>${h}</button></th>`).join('');
  return `<table class="pt"><thead><tr><th class="l"><button disabled>${esc(units[s].t.name)}</button></th>${head}</tr></thead><tbody>${rows}` +
    `<tr class="total"><td class="l">Team</td><td>200</td><td><b>${show(total[0])}</b></td><td>${show(total[1])}</td><td>${show(total[2])}</td><td>${show(total[3])}</td><td>${show(total[4])}</td><td>${show(total[5])}</td>` +
    `<td>${show(total[6])}-${show(total[7])}${pct(6, 7)}</td><td>${show(total[8])}-${show(total[9])}${pct(8, 9)}</td><td>${show(total[10])}-${show(total[11])}${pct(10, 11)}</td></tr></tbody></table>`;
}

// how the final margins were spread: each bar is a range of winning margins, the first team's wins on the left
function simMarginChart(acc, units) {
  const n = acc.tally[0], bins = 9, counts = [new Array(bins).fill(0), new Array(bins).fill(0)];
  acc.margins.forEach((games, at) => { const m = at - 120; if (games && m) counts[m > 0 ? 0 : 1][Math.min(bins - 1, Math.floor((Math.abs(m) - 1) / 4))] += games; });
  const W = 1160, H = 210, top = 22, base = H - 40, step = (W - 20) / (bins * 2), most = Math.max(...counts[0], ...counts[1], 1);
  const label = i => i === bins - 1 ? `${4 * i + 1}+` : `${4 * i + 1}–${4 * i + 4}`;
  let svg = `<svg class="gs-hist" viewBox="0 0 ${W} ${H}" role="img" aria-label="How often each final margin came up"><line x1="10" x2="${W - 10}" y1="${base}" y2="${base}"/>`;
  for (let k = 0; k < bins * 2; k++) {
    const s = k < bins ? 0 : 1, i = s === 0 ? bins - 1 - k : k - bins, count = counts[s][i];
    const x = 10 + step * k + 2, h = Math.max(count ? 2 : 0, (base - top) * count / most), share = 100 * count / n;
    svg += `<g><title>${esc(units[s].t.name)} by ${label(i)}: ${count.toLocaleString()} of ${n.toLocaleString()} games (${share.toFixed(1)}%)</title>` +
      `<rect class="${s === 0 ? 'a' : 'b'}" x="${x.toFixed(1)}" y="${(base - h).toFixed(1)}" width="${(step - 4).toFixed(1)}" height="${h.toFixed(1)}" rx="4"/>` +
      (count ? `<text class="v" x="${(x + step / 2 - 2).toFixed(1)}" y="${(base - h - 6).toFixed(1)}">${share >= 10 ? share.toFixed(0) : share.toFixed(1)}%</text>` : '') +
      `<text x="${(x + step / 2 - 2).toFixed(1)}" y="${base + 16}">${label(i)}</text></g>`;
  }
  svg += `<text x="${10 + step * bins / 2}" y="${H - 6}">${esc(units[0].t.name)} wins by</text><text x="${10 + step * bins * 1.5}" y="${H - 6}">${esc(units[1].t.name)} wins by</text>`;
  return svg + `</svg>`;
}

// How each team got its points: plays and points a game by kind of play
function simKindsCard(acc, units) {
  const n = acc.tally[0], kinds = [0, 1].map(s => acc.sides[s].kinds);
  if (!sumOf(Array.from(kinds[0])) || !sumOf(Array.from(kinds[1]))) return '';
  const totals = kinds.map(k => sumOf(PLAY_NAMES.map((_, i) => k[2 * i])));
  const cells = (k, i, total) => `<td>${(k[2 * i] / n).toFixed(1)}</td><td>${(100 * k[2 * i] / total).toFixed(0)}%</td><td><b>${(k[2 * i + 1] / n).toFixed(1)}</b></td><td>${k[2 * i] ? (k[2 * i + 1] / k[2 * i]).toFixed(2) : '–'}</td>`;
  const head = name => `<th><button disabled title="Plays of this kind a game">${esc(name)} plays</button></th><th><button disabled title="Share of the team’s plays">Share</button></th>` +
    `<th><button disabled title="Points a game from this kind of play">Points</button></th><th><button disabled title="Points per play">Per play</button></th>`;
  return `<div class="card tp-card"><h3>How each team scores<span>plays and points a game by kind of play, in these games</span></h3>` +
    `<table class="pt"><thead><tr><th class="l"><button disabled></button></th>${head(units[0].t.name)}${head(units[1].t.name)}</tr></thead><tbody>` +
    PLAY_NAMES.map((name, i) => `<tr title="${esc(PLAY_TIPS[i])}"><td class="l">${name}</td>${cells(kinds[0], i, totals[0])}${cells(kinds[1], i, totals[1])}</tr>`).join('') +
    `</tbody></table><div class="wo-note" style="padding-top:12px">Every trip starts with a kind of play, in the mix each offense runs against this defense. The play decides who shoots, from where, and whether it is assisted; ` +
    `turnovers are counted before a play is chosen, so they are not in this table.</div></div>`;
}

function renderSimResult(acc, units, pace, styles) {
  const tally = acc.tally, n = tally[0], winsA = tally[1], winsB = tally[2], TA = units[0].t, TB = units[1].t;
  const mean = (tally[4] + tally[5]) / n, spread = Math.sqrt(Math.max(0, tally[6] / n - mean * mean));
  const score = s => { let points = 0; for (let i = 0; i < units[s].count; i++) points += acc.sides[s].box[i * SIM_STATS]; return points / n; };
  const scoreA = score(0), scoreB = score(1);
  const share = games => (100 * games / n).toFixed(n >= 1000000 ? 2 : 1) + '%';
  const leader = mean >= 0 ? TA : TB;
  const tile = (label, value, note) => `<div class="tp-tile"><div class="k">${label}</div><div class="v">${value}</div><div class="s">${note}</div></div>`;
  const blowouts = s => { let games = 0; acc.margins.forEach((count, at) => { if ((s ? -1 : 1) * (at - 120) >= 15) games += count; }); return games; };
  const out = ['a', 'b'].map(k => [...sim.out[k]]).flat();
  const signed = v => (v > 0 ? '+' : '') + v.toFixed(1).replace('-', '−');
  const half = v => String(Math.round(v * 2) / 2);        // margins to the nearest half point, like a point spread: 1, 1.5, 2
  const wonBy = winsA ? tally[4] / winsA : null, lostBy = winsB ? -tally[5] / winsB : null;     // the first team's average win, and average loss
  const row = (T, wins, all, won, lost, big) => `<tr><td class="l">${teamLink(T.name, esc(T.name))}</td><td>${share(wins)}</td><td><b>${half(Math.abs(all)) === '0' ? '0' : (all > 0 ? '+' : '−') + half(Math.abs(all))}</b></td>` +
    `<td>${won == null ? '–' : '+' + half(won)}</td><td>${lost == null ? '–' : '−' + half(lost)}</td><td>${share(big)}</td></tr>`;
  const enough = Math.min(winsA, winsB) >= 50;
  const reasonColumn = s => {
    const T = units[s].t, wins = s ? winsB : winsA, list = enough ? simReasons(acc, units, s) : wins ? simDescribe(acc, units, s) : [];
    return `<div><h4>${simBadge(T)}${esc(T.name)}</h4><ul>` + (list.length ? list.map(text => `<li>${text}</li>`).join('')
      : `<li>${wins ? 'Nothing stood out.' : `${esc(T.name)} did not win any of these games.`}</li>`) + `</ul></div>`;
  };
  $('gs-result').innerHTML =
    `<div class="card tp-card"><h3>Win probability<span>${esc(TA.name)} vs ${esc(TB.name)} · ${siteWords()} · ${n.toLocaleString()} simulated games` +
      `${out.length ? ' · without ' + out.map(esc).join(', ') : ''}</span></h3>` +
      `<div class="gs-ends"><div class="gs-end"><i class="key a"></i>${simBadge(TA)}<span>${esc(TA.name)}</span><span class="pc">${share(winsA)}</span></div>` +
      `<div class="gs-end r"><i class="key b"></i>${simBadge(TB)}<span>${esc(TB.name)}</span><span class="pc">${share(winsB)}</span></div></div>` +
      `<div class="gs-bar" role="img" aria-label="${esc(TA.name)} ${share(winsA)}, ${esc(TB.name)} ${share(winsB)}"><i class="a" style="flex:${winsA}"></i><i class="b" style="flex:${winsB}"></i></div></div>` +
    `<div class="tp-tiles gs-tiles">` +
      tile('Average score', `${scoreA.toFixed(1)}–${scoreB.toFixed(1)}`, `${esc(TA.name)} – ${esc(TB.name)}`) +
      tile('Average margin', half(Math.abs(mean)) === '0' ? 'Even' : `${esc(leader.name)} by ${half(Math.abs(mean))}`, '') +
      tile('Average total', (scoreA + scoreB).toFixed(1), `about ${pace.toFixed(0)} possessions each`) +
      tile('Overtime', share(tally[3]), `${tally[3].toLocaleString()} of ${n.toLocaleString()} games`) + `</div>` +
    `<div class="card tp-card"><h3>Margins<span>points won or lost by</span></h3>` +
      `<table class="pt"><thead><tr><th class="l"><button disabled></button></th><th><button disabled>Win %</button></th>` +
      `<th><button disabled title="Average margin over every game: wins count as plus, losses as minus">Avg margin, all games</button></th>` +
      `<th><button disabled title="Average margin in the games it won">Avg win by</button></th><th><button disabled title="Average deficit in the games it lost">Avg loss by</button></th>` +
      `<th><button disabled title="Share of all games it won by 15 or more">Wins by 15+</button></th></tr></thead><tbody>` +
      row(TA, winsA, mean, wonBy, lostBy, blowouts(0)) + row(TB, winsB, -mean, lostBy, wonBy, blowouts(1)) + `</tbody></table>` +
      simMarginChart(acc, units) +
      `<div class="wo-note" style="padding-top:10px">A typical game lands about ${spread.toFixed(0)} points either side of the average margin, so even matched teams produce blowouts now and then. ` +
      `By play types and the players on the floor, ${esc(TA.name)} should score ${styles[0].toFixed(1)} points per 100 possessions against this defense and ${esc(TB.name)} ${styles[1].toFixed(1)}.</div></div>` +
    `<div class="card tp-card"><h3>Why each team wins<span>${enough ? 'what is different about the games each team wins' : 'one team won too few games to compare its wins with its losses, so this is what the games looked like'}</span></h3>` +
      `<div class="gs-keys">${reasonColumn(0)}${reasonColumn(1)}</div></div>` +
    simKindsCard(acc, units) +
    `<div class="card tp-card"><h3>Average box score<span>per game over ${n.toLocaleString()} games</span></h3>${simBoxTable(acc, units, 0)}${simBoxTable(acc, units, 1)}` +
      `<div class="wo-note" style="padding-top:12px">Each game is played one possession at a time, and it runs on play types, not on team ratings. How well an offense scores comes from how often its players run each kind of play and how well they score on it (adjusted for strength of schedule), ` +
      `set against how well the other team’s players defend that kind of play, plus home court. ` +
      (CURRENT_SEASON ? `The teams’ offensive and defensive ratings are not used. ` : `Where play types cover only part of a team’s games this season, the scoring level leans on the team ratings for the rest, while play types still decide how the game is played. `) +
      `Every trip starts with a kind of play, in the mix this offense runs against this defense; the play decides who shoots (the players who run it), from where, and whether it is assisted. Turnovers, rebounds and free throws come from the teams’ and players’ season numbers, and every player draws a better or worse night each game. ` +
      `Minutes come from the play-by-play: each player’s share of the floor time while games were still in doubt (judged by the lead and the time left together, so 20 up with 15 minutes to go still counts and 13 up in the last minute does not), counting most the real games most like this matchup, so the end of the bench does not play against a good team. ` +
      `A player who is out takes his plays with him: the kinds of play he runs come up less, the rest go to teammates at their own efficiency, and the defense is judged by who is left. The simulator never looks up a real game between these two teams; if they did play, that game is only one of the season’s games inside their numbers. ` +
      `And-ones, three-shot fouls and foul trouble are not modelled.</div></div>`;
}

// ---------- tournament simulator ----------
// A 64-team bracket filled in by hand. Every matchup is played BRACKET_GAMES times on a neutral floor, then one of
// those games is drawn at random to be the official one, and its winner moves on.
const BRACKET_GAMES = 100000;
const BRACKET_SEEDS = [1, 16, 8, 9, 5, 12, 4, 13, 6, 11, 3, 14, 7, 10, 2, 15];     // the order the seeds sit in a region
const BRACKET_REGIONS = ['East', 'South', 'West', 'Midwest'];
// Which region the first one meets in the Final Four (the other two meet each other); chosen on the page
const bracketPairs = pair => [[0, pair], [1, 2, 3].filter(r => r !== pair)];
const pairWords = pair => bracketPairs(pair).map(([x, y]) => `${BRACKET_REGIONS[x]} against ${BRACKET_REGIONS[y]}`).join(', ');
const BRACKET_ROUNDS = ['Round of 64', 'Round of 32', 'Sweet 16', 'Elite 8', 'Final Four', 'Championship'];
const bracket = { slots: new Array(64).fill(''), pair: 1, played: 1, games: [], run: 0, job: null, busy: false, status: '' };
try {
  let saved = JSON.parse(localStorage.getItem('strongside-bracket-2' + SEASON_TAG) || 'null');
  if (!saved && CURRENT_SEASON) {       // a bracket saved when the regions ran East, West, South, Midwest: keep each team in its region
    const old = JSON.parse(localStorage.getItem('strongside-bracket') || '[]');
    if (old.length === 64) saved = [...old.slice(0, 16), ...old.slice(32, 48), ...old.slice(16, 32), ...old.slice(48)];
  }
  if (saved && saved.length === 64) bracket.slots = saved.map(name => teamByName[name] ? name : '');
  const pair = +localStorage.getItem('strongside-bracket-pair' + SEASON_TAG);
  if (pair >= 1 && pair <= 3) bracket.pair = bracket.played = pair;
} catch (e) {}
const saveBracket = () => { try { localStorage.setItem('strongside-bracket-2' + SEASON_TAG, JSON.stringify(bracket.slots)); localStorage.setItem('strongside-bracket-pair' + SEASON_TAG, bracket.pair); } catch (e) {} };
const teamByLower = Object.fromEntries(teams.map(t => [t.name.toLowerCase(), t.name]));

// A field of 64 by our ratings: every conference's best-rated team gets its automatic bid, the 32 best-rated others
// get the at-large bids, and the 64 are seeded down the ratings, the seed lines snaking across the four regions.
function projectedField() {
  const byRating = [...teams].sort((a, b) => b.n - a.n);
  const auto = new Map();
  for (const t of byRating) if (t.conf && !/^ind/i.test(t.conf) && !auto.has(t.conf)) auto.set(t.conf, t);
  const field = new Set(auto.values());
  for (const t of byRating) { if (field.size >= 64) break; field.add(t); }
  const seeded = [...field].sort((a, b) => b.n - a.n).slice(0, 64);
  const slots = Array(64).fill('');
  seeded.forEach((t, i) => {
    const line = Math.floor(i / 4), k = i % 4, region = line % 2 ? 3 - k : k;
    slots[region * 16 + BRACKET_SEEDS.indexOf(line + 1)] = t.name;
  });
  return slots;
}
function bracketProblems() {
  const filled = bracket.slots.filter(Boolean), twice = [...new Set(filled.filter((name, i) => filled.indexOf(name) !== i))];
  return { filled: filled.length, twice };
}
function renderBracket() {
  const region = r => `<div class="card tp-card bk-region"><h3>${BRACKET_REGIONS[r]}</h3>` +
    BRACKET_SEEDS.map((seed, i) => `<label class="bk-slot"><span class="seed">${seed}</span>` +
      `<input list="bk-teams" data-slot="${r * 16 + i}" value="${esc(bracket.slots[r * 16 + i])}" placeholder="Team" autocomplete="off" spellcheck="false" aria-label="${BRACKET_REGIONS[r]} ${seed} seed"></label>`).join('') + `</div>`;

function bracketStatus() {
  if (!$('bk-go')) return;
  const { filled, twice } = bracketProblems();
  for (const input of document.querySelectorAll('#bracket-view input[data-slot]')) {
    const name = bracket.slots[+input.dataset.slot];
    input.classList.toggle('bad', (!name && input.value.trim() !== '') || twice.includes(name));
  }
  $('bk-go').disabled = bracket.busy || chase.busy || filled < 64 || twice.length > 0;
  $('bk-stop').hidden = !bracket.busy;
  $('bk-status').textContent = bracket.busy ? bracket.status
    : twice.length ? `In the bracket more than once: ${twice.join(', ')}`

}
function renderBracketResult() {
  const box = $('bk-result');
  if (!box) return;
  if (!bracket.games.length) { box.innerHTML = ''; return; }
  const line = (g, k) => {
    const team = k ? g.b : g.a, won = g.winner === k;
    return `<span class="bk-team${won ? ' win' : ''}"><span class="seed">${team.seed}</span><span class="nm">${esc(team.name)}</span><span class="sc">${g.score ? g.score[k] : ''}</span></span>`;
  };
  const game = g => {
    if (!g) return `<span class="bk-game wait"><span class="bk-team"><span class="nm">–</span></span><span class="bk-team"><span class="nm">–</span></span><small>&nbsp;</small></span>`;
    let note = 'playing…';
    if (g.winner != null) {
      const share = g.winner ? 1 - g.share : g.share;
      note = `won ${(100 * share).toFixed(1)}% of ${BRACKET_GAMES.toLocaleString()}` + (share < 0.5 ? ` · <span class="upset">upset</span>` : '');
    }
    return `<a class="bk-game" href="#sim" data-a="${esc(g.a.name)}" data-b="${esc(g.b.name)}" title="Open this matchup in the game simulator">${line(g, 0)}${line(g, 1)}<small>${note}</small></a>`;
  };
  const find = (round, index) => bracket.games.find(g => g.round === round && g.index === index);
  const column = (round, first, count) => `<div class="bk-round"><h4>${BRACKET_ROUNDS[round]}</h4><div class="bk-col">` +
    Array.from({ length: count }, (_, i) => game(find(round, first + i))).join('') + `</div></div>`;
  const final = find(5, 0), champion = final && final.winner != null ? (final.winner ? final.b : final.a) : null;
  const t = champion && teamByName[champion.name];

    (champion ? `<div class="card tp-card"><div class="bk-champ">${simBadge(t)}<span>${teamLink(t.name, esc(t.name))}</span><small>No. ${champion.seed} seed · national champion</small></div></div>` : '') +
    `<div class="card tp-card"><h3>Final Four<span>${pairWords(bracket.played)}</span></h3><div class="bk-rounds">${column(4, 0, 2)}${column(5, 0, 1)}</div></div>` +
    [0, 1, 2, 3].map(r => `<div class="card tp-card"><h3>${BRACKET_REGIONS[r]}</h3><div class="bk-rounds">` +
      [0, 1, 2, 3].map(round => column(round, r * (8 >> round), 8 >> round)).join('') + `</div></div>`).join('') +
    `<div class="wo-note" style="padding:14px 4px 0">The score shown is the one game drawn as official; the percentage is how often its winner won all ${BRACKET_GAMES.toLocaleString()} games of that matchup. ` +

}
async function runBracket() {
  const { filled, twice } = bracketProblems();
  if (bracket.busy || chase.busy || filled < 64 || twice.length) return;
  const run = ++bracket.run, started = performance.now();
  bracket.busy = true; bracket.games = []; bracket.played = bracket.pair;
  let field = bracket.slots.map((name, i) => ({ name, seed: BRACKET_SEEDS[i % 16] })), played = 0;
  for (let round = 0; field.length > 1; round++) {
    const next = [];
    if (field.length === 4) field = bracketPairs(bracket.played).flat().map(r => field[r]);      // the four region winners, paired as chosen
    for (let i = 0; i < field.length; i += 2) {
      const g = { round, index: i / 2, a: field[i], b: field[i + 1] };
      bracket.games.push(g);
      bracket.status = `Game ${++played} of 63 · ${BRACKET_ROUNDS[round]}: ${g.a.name} vs ${g.b.name}`;
      bracketStatus(); renderBracketResult();
      bracket.job = simGames(teamByName[g.a.name], teamByName[g.b.name], 'N', new Set(), new Set(), BRACKET_GAMES, null, true, true);
      const { acc } = await bracket.job.promise;
      if (run !== bracket.run) return;
      g.share = acc.tally[1] / acc.tally[0];            // how often the first team won
      g.score = [acc.kept[0], acc.kept[1]];             // the official game
      g.winner = g.score[0] > g.score[1] ? 0 : 1;
      next.push(g.winner ? g.b : g.a);
    }
    field = next;
  }
  bracket.busy = false;
  bracket.status = `${field[0].name} wins it all · 63 matchups, ${(63 * BRACKET_GAMES).toLocaleString()} games in ${simTime((performance.now() - started) / 1000)}`;
  bracketStatus(); renderBracketResult();
}

// One job: play every game of the season in the simulator, as it stood on the day of the game, and report how the
// simulator's spreads compare with the real betting spreads. (The final scores are not part of the comparison.) spreadreport.js (built by
// main\Spreadstat.py) holds, for each game, what was known that morning: both teams' ratings, tempo, four factors,
// shots and play types and every player's numbers from the games before it, who actually played, the real
// spread and the final score. Pressing the button plays each game SPREAD_SIMS times.
// Every margin is from the first team's side: the home team, or on a neutral floor the team listed as home.
const SPREAD_SIMS = 100000;
const USEFUL_MINUTES = 10;      // a player averaging this many minutes (in the games he had played) is "useful": his absences are the ones counted and listed
const INJURY_STEADY_MINUTES = 200, INJURY_RETURNING = false;        // see pitUnit

  if (window.SPREADS) return Promise.resolve(window.SPREADS);

    const tag = document.createElement('script');
    tag.src = 'spreadreport.js';
    tag.onload = () => window.SPREADS ? resolve(window.SPREADS) : reject();
    tag.onerror = reject;
    document.head.appendChild(tag);
  });

      `<table class="pt">${head([['Games'], ['N'], ['Mean difference', 'Simulator minus real spread'], ['Average gap', 'Mean absolute difference between the two spreads'], ['Median gap'], ['r', 'Correlation between the two spreads'],
        ['Slope', 'Points of real spread per point of simulator spread'], ['Within 2'], ['Same favourite']])}<tbody>` +
      group('Month', [['December', x => x.date.slice(5, 7) === '12'], ['January', x => x.date.slice(5, 7) === '01'], ['February', x => x.date.slice(5, 7) === '02'], ['March', x => x.date.slice(5, 7) === '03']]) +
      group('Games both teams had played', [['5 to 9', x => x.played < 10], ['10 to 14', x => x.played >= 10 && x.played < 15], ['15 to 19', x => x.played >= 15 && x.played < 20], ['20 to 24', x => x.played >= 20 && x.played < 25], ['25 or more', x => x.played >= 25]]) +
      group('Where', [['Home court', x => x.home], ['Neutral floor', x => !x.home]]) +
      group('Kind of game', [['Non-conference', x => x.type === 'Regular Season' && !x.conf], ['Conference', x => x.type === 'Regular Season' && x.conf], ['Conference tournaments', x => x.type !== 'Regular Season']]) +
      group('Size of the real spread', [['Under 3 points', x => size(x) < 3], ['3 to 6.5', x => size(x) >= 3 && size(x) < 7], ['7 to 11.5', x => size(x) >= 7 && size(x) < 12], ['12 to 19.5', x => size(x) >= 12 && size(x) < 20], ['20 or more', x => size(x) >= 20]]) +
      group('Who the market favoured', [['Home team favoured', x => x.home && x.market > 0], ['Road team favoured', x => x.home && x.market < 0]]) +
      `</tbody></table></div>` +

    `<div class="card tp-card"><h3>5. Biggest disagreements<span>the 25 games where the simulator and the real spread were furthest apart</span></h3><table class="pt">${gameHead}<tbody>${biggest.map(gameRow).join('')}</tbody></table></div>` +

    `<div class="card tp-card"><div class="tp-bar"><h3>6. Every game<span>${found.length.toLocaleString()} games, latest first</span></h3>` +
      `<label class="field" style="margin-left:auto"><input id="sr-q" type="search" placeholder="Search a team" value="${esc(sr.q)}" autocomplete="off" aria-label="Search a team"></label></div>` +
      `<table class="pt">${gameHead}<tbody>${found.slice(0, sr.shown).map(gameRow).join('')}</tbody></table>` +
      (found.length > sr.shown ? `<div class="gs-run" style="border-top:0;margin-top:0"><button class="clear" id="sr-more">Show ${Math.min(200, found.length - sr.shown)} more</button></div>` : '') + `</div>` +

    `<div class="card tp-card"><h3>Data and method</h3><div class="wo-note" style="padding-top:8px">` +
      `<b>What is compared.</b> Only the two spreads: the simulator’s and the market’s. The final score plays no part in any number on this page. ` +
      `<b>Data.</b> ${meta.counts.games.toLocaleString()} games between Division I teams, replayed one game day at a time. November is used only to collect data: its ${meta.counts.before.toLocaleString()} games build the ratings and everything else, and the comparison starts on ${fmtDate(meta.from)}. Also left out: ${meta.counts.early.toLocaleString()} games in which a team had played fewer than ${meta.skip} games, and ${meta.counts.no_line} with no real spread listed. NCAA tournament games are not in the box score data, so the season ends with the conference tournaments. ` +
      `<b>The real spread</b> is from ${esc(meta.source || 'the betting site')}.${meta.counts.other_book ? ` ${meta.counts.other_book.toLocaleString()} games had no line there and use the one BetIQ lists.` : ''} ` +
      `<b>The simulator’s spread</b> is its average margin over ${sr.ran.games.toLocaleString()} plays of the game (accurate to about ${srNum(12.5 / Math.sqrt(sr.ran.games), 2)} points), rounded to the nearest half point. It runs on play types, not team ratings: how often each team runs each kind of play and how well it scores on it, adjusted for strength of schedule, against what the other team allows on that kind of play. Play types, tempo, four factors, shot zones and every player’s numbers were rebuilt for each date from only the games played before it; home court is the home team’s own edge, measured from 2024-25 (about ${meta.home_measured} points per 100 possessions per side for a typical team). ` +
      `<b>The 2024-25 head start.</b> Early on a team has too few games to judge, so its scoring level leans on what its current players did in 2024-25, wherever they played: each player’s box plus/minus from last season, weighed by the minutes he is playing now (${meta.head_start.players.toLocaleString()} of this season’s players were found in last season’s data). ` +
      (meta.head_start.program ? `It also leans on how the program itself played in 2024-25: what the team scored and allowed on each kind of play, against the D-I average for that play, counting like ${meta.head_start.program} of the team’s own games on ${fmtDate(meta.from)} and fading on the same calendar. ` : '') +
      `Last season only speaks for the role a player actually had: one who played 60% of the minutes then and 80% now is known for the 60%, and the rest of his minutes, like all of a freshman’s, are judged on what he has done so far this season. ` +
      `Only how good a team is carries over; how it plays (its mix of play types) comes from this season alone. The head start counts like ${meta.head_start.games} of the team’s own games on ${fmtDate(meta.from)}, less for a team of newcomers, fades to nothing by ${fmtDate(meta.head_start.ends)}, and never moves a team more than ${meta.head_start.cap} points per 100 possessions from what its own games say. Its size and how far it is stretched were chosen to bring the December spreads closest to the real ones. ` +
      `<b>Absent players.</b> Only the players who played in the real game play in the simulator. Their usual minutes are stretched to fill the game, and the team’s rating moves by what that change in who is on the floor is worth, using each player’s box plus/minus as it stood that day (half to offense, half to defense). A plus/minus built on few minutes is pulled toward the team’s average player, as if he had ${INJURY_STEADY_MINUTES} more minutes at that level. ` +
      `Rotations come from minutes played so far; the play-by-play rotations and on/off numbers the Game sim uses cover the whole season, so they are not used here. ` +
      `<b>Margins</b> are from the first team’s side: the home team, or on a neutral floor the team the schedule lists as home. The simulator’s spread is rounded to the nearest half point before anything is measured, so every number on this page compares a line as it would be posted with the line that was. ` +
      `<b>Limits.</b> The market also knows about last season, the preseason and anything else bettors know; the ratings start from nothing each November. Who sat is read from the game’s own box score (the market knows most of that before tip-off, but not all). ` +
      `The simulator’s settings (home court, how blowouts are weighed) and each player’s position for the play types were fixed using this whole season. ` +
      `Season file built ${esc(meta.built)}.</div></div>`;
}

$('spread-view').addEventListener('click', e => {

  if (e.target.closest('#sr-stop')) { stopSeason(false); return; }
  const b = e.target.closest('button[data-sr]');
  if (b) { const [name, value] = b.dataset.sr.split(':'); sr[name] = value; sr.shown = 100; renderSpreads(); return; }
  if (e.target.closest('#sr-more')) { sr.shown += 200; drawSpreads(); }
});
$('spread-view').addEventListener('change', e => {
  const select = e.target.closest('select[data-sr-select]');
  if (select) { sr[select.dataset.srSelect] = select.dataset.srSelect === 'played' ? +select.value : select.value; sr.shown = 100; drawSpreads(); return; }

});

// ---------- Team scatter: any two team numbers against each other ----------
// Box-score metrics are worked out from each team's per-game box score ("o" = its own, "d" = its opponents'), so every
// one of them also has an "Against" side: the same number for the team's opponents. better: 'high', 'low' or 'none'
// (no direction: the axis is not turned around and the corners are not labelled).
const SC_POWER = ['ACC', 'Big 12', 'Big East', 'Big Ten', 'SEC', 'Pac-12'];
const SC_TOUCH = window.matchMedia && matchMedia('(hover: none)').matches;
const SC_FIELD = new Set(REAL_BRACKET ? REAL_BRACKET.slots : []);
// The Trapezoid of Excellence is Ryan Hammer's idea: title teams have a high net rating and a pace that is neither
// too fast nor too slow, and the better the team the more pace it can get away with, so the zone widens upward. He
// draws it by hand on KenPom's adjusted tempo and does not publish the lines, so this is Strongside's version, worked
// out from each season's own numbers: the floor is the top 5% of net ratings; at the floor the pace window is one
// standard deviation either side of the average pace, widening to two at the top of the chart.
function scTrapezoid() {
  const tempos = teams.map(t => t.t).filter(v => v != null), nets = teams.map(t => t.n).filter(v => v != null).sort((a, b) => a - b);
  if (!tempos.length || !nets.length) return null;
  const mu = tempos.reduce((s, v) => s + v, 0) / tempos.length;
  const sd = Math.sqrt(tempos.reduce((s, v) => s + (v - mu) ** 2, 0) / tempos.length);
  const floor = nets[Math.floor(0.95 * (nets.length - 1))], top = nets[nets.length - 1] + 4;
  const half = n => sd * (1 + Math.max(0, Math.min(1, (n - floor) / (top - floor))));
  return { mu, sd, floor, top, corners: [[mu - sd, floor], [mu + sd, floor], [mu + 2 * sd, top], [mu - 2 * sd, top]],
           inside: t => t.n != null && t.t != null && t.n >= floor && Math.abs(t.t - mu) <= half(t.n) };
}

const scNum = v => typeof v === 'number' && isFinite(v) ? v : null;
const scDiv = (a, b) => b ? a / b : null;
const scCount = (s, key) => key === '2pm' ? s.fgm - s['3pm'] : key === '2pa' ? s.fga - s['3pa'] : key === 'dr' ? s.reb - s.or : s[key];
// each team's share of minutes and points by class, from the players

  const fy = v => by === 'low' ? T + (v - y0) / (y1 - y0) * (H - T - B) : T + (y1 - v) / (y1 - y0) * (H - T - B);
  const tx = scTicks(x0, x1), ty = scTicks(y0, y1);
  const tickText = (m, v, dec) => m.height ? scFmt(m, v) : v.toFixed(dec);
  let g = `<defs><clipPath id="sc-clip"><rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}"/></clipPath></defs>`;
  g += tx.ticks.map(v => `<line class="grid" x1="${fx(v)}" x2="${fx(v)}" y1="${T}" y2="${H - B}"/><text x="${fx(v)}" y="${H - B + 18}" text-anchor="middle">${tickText(mx, v, tx.dec)}</text>`).join('');
  g += ty.ticks.map(v => `<line class="grid" x1="${L}" x2="${W - R}" y1="${fy(v)}" y2="${fy(v)}"/><text x="${L - 8}" y="${fy(v) + 4}" text-anchor="end">${tickText(my, v, ty.dec)}</text>`).join('');
  g += `<g clip-path="url(#sc-clip)"><line class="avg" x1="${fx(ax)}" x2="${fx(ax)}" y1="${T}" y2="${H - B}"/><line class="avg" x1="${L}" x2="${W - R}" y1="${fy(ay)}" y2="${fy(ay)}"/>`;
  // the line of best fit and how strong the relationship is
  const n = pts.length;
  let sxy = 0, sxx = 0, syy = 0;
  for (const r of pts) { sxy += (r.x - ax) * (r.y - ay); sxx += (r.x - ax) ** 2; syy += (r.y - ay) ** 2; }
  const corr = sxx && syy ? sxy / Math.sqrt(sxx * syy) : null, slope = sxx ? sxy / sxx : 0;
  if (sc.trend && corr != null) g += `<line class="trend" x1="${fx(x0)}" y1="${fy(ay + slope * (x0 - ax))}" x2="${fx(x1)}" y2="${fy(ay + slope * (x1 - ax))}"/>`;

  }
  g += `</g>`;
  if (bx !== 'none' && by !== 'none') {
    g += `<text class="corner" x="${W - R - 8}" y="${T + 16}" text-anchor="end">Better at both</text>` +

  }
  const arrow = b => b === 'low' ? ' (lower is better)' : '';
  g += `<text class="ax" x="${L + (W - L - R) / 2}" y="${H - 14}" text-anchor="middle">${esc(lx + arrow(bx))}</text>`;
  g += `<text class="ax" transform="translate(18 ${T + (H - T - B) / 2}) rotate(-90)" text-anchor="middle">${esc(ly + arrow(by))}</text>`;
  const ordered = [...pts].sort((a, b) => isFocus(a) - isFocus(b));
  g += `<g clip-path="url(#sc-clip)">` + ordered.map(r => {
    const px = fx(r.x), py = fy(r.y), cls = 'pt' + (focusing && !isFocus(r) ? ' fade' : '') + (focusing && isFocus(r) ? ' hot' : '') +
      (trap && trap.inside(r.t) ? ' intrap' : '');
    const mark = sc.logos && r.t.logo
      ? `<circle class="lb" cx="${px}" cy="${py}" r="${logo / 2 + 2}"/><image href="${esc(r.t.logo)}" x="${px - logo / 2}" y="${py - logo / 2}" width="${logo}" height="${logo}"/>`
      : `<circle class="dot" cx="${px}" cy="${py}" r="${sc.logos ? 7 : 5.5}"/>`;
    const label = focusing && isFocus(r) && (sc.focus.length + (sc.focusConf ? 20 : 0)) <= 40 ? `<text class="lbl" x="${px}" y="${py - 16}" text-anchor="middle">${esc(r.name)}</text>` : '';
    const star = champ && r.name === champ ? `<text class="champ" x="${px + logo / 2 + 4}" y="${py - logo / 2 + 2}">★</text>` : '';
    return `<g class="${cls}" data-scteam="${esc(r.name)}">${mark}${label}${star}</g>`;

  svg.innerHTML = g;
  svg.setAttribute('aria-label', `${ly} against ${lx}, ${n} teams`);
  $('sc-stats').innerHTML = corr == null ? '' :
    `Correlation r = <b>${corr.toFixed(2)}</b> · R² = ${(corr * corr).toFixed(2)} · ${n} teams · averages: ${esc(scFmt(mx, ax))} and ${esc(scFmt(my, ay))}` +
    (Math.abs(corr) < 0.1 ? ' · almost no relationship' : Math.abs(corr) < 0.3 ? ' · weak relationship' : Math.abs(corr) < 0.6 ? ' · moderate relationship' : ' · strong relationship') +
    ((bx === 'low') !== (by === 'low') && Math.abs(corr) >= 0.1 ? ` · r is on the raw numbers; with one axis flipped, a ${corr < 0 ? 'negative' : 'positive'} r runs ${corr < 0 ? 'up' : 'down'} and to the right here` : '');
  if (trap) {
    const inside = teams.filter(trap.inside).sort((a, b) => b.n - a.n);
    $('sc-stats').innerHTML += `<div class="sc-trapnote"><b>Trapezoid of Excellence:</b> ${inside.length} teams inside — ${inside.map(t => esc(t.name)).join(', ')}.` +
      (champ ? ` ★ ${esc(champ)} won the title and was ${trap.inside(teamByName[champ] || {}) ? '<b>inside</b>' : '<b>outside</b>'} the trapezoid.` : '') +
      `<br>Ryan Hammer’s idea, drawn here from this season’s numbers (his exact lines are drawn by hand and not published): net rating at or above ${esc(scFmt(SC_BY_ID.adj_n, trap.floor))} (the top 5%), ` +
      `pace within ${trap.sd.toFixed(1)} of the ${trap.mu.toFixed(1)} average at that line, widening to ${(2 * trap.sd).toFixed(1)} at the top. He uses KenPom’s adjusted tempo; this pace is possessions per 40 minutes.</div>`;
  }
  scTable(rows, mx, my, lx, ly, bx, by, isFocus);
}
function scTable(rows, mx, my, lx, ly, bx, by, isFocus) {
  const q = sc.q.trim().toLowerCase();
  let list = rows.filter(r => !q || r.name.toLowerCase().includes(q) || r.t.conf.toLowerCase().includes(q));
  const sortKey = sc.sort, dir = sc.dir || ((sortKey === 'x' ? bx : sortKey === 'y' ? by : 'high') === 'low' ? 1 : -1);
  const val = r => sortKey === 'name' ? r.name : sortKey === 'conf' ? r.t.conf : sortKey === 'rec' ? winPct(r.t) : r[sortKey];
  list.sort((a, b) => {
    const va = val(a), vb = val(b);
    if (va == null) return 1; if (vb == null) return -1;
    return typeof va === 'string' ? dir * va.localeCompare(vb) : dir * (va - vb);

  sc.page = Math.min(sc.page, pages - 1);
  const head = (key, label, cls = '') => `<th class="${cls}${sc.sort === key ? ' active' : ''}"><button data-scsort="${key}">${label}<span class="arr">${(sc.dir || dir) > 0 ? '▲' : '▼'}</span></button></th>`;
  $('sc-table').innerHTML = `<thead><tr><th class="c"><button disabled>#</button></th>${head('name', 'Team', 'l')}${head('rec', 'W-L', 'c')}${head('x', esc(lx), 'xy')}${head('y', esc(ly), 'xy')}</tr></thead><tbody>` +
    list.slice(sc.page * per, sc.page * per + per).map((r, i) => {
      const logo = r.t.logo ? `<img src="${esc(r.t.logo)}" alt="" loading="lazy">` : '';
      return `<tr class="${isFocus(r) ? 'hot' : ''}"><td class="pos">${sc.page * per + i + 1}</td>` +
        `<td class="team"><span class="team-in"><span class="badge"${logo ? '' : ' style="visibility:hidden"'}>${logo}</span>${teamLink(r.name, esc(r.name))}</span></td>` +
        `<td class="mid">${r.t.w}-${r.t.l}</td><td>${esc(scFmt(mx, r.x))}${r.xr ? `<small>${r.xr}</small>` : ''}</td><td>${esc(scFmt(my, r.y))}${r.yr ? `<small>${r.yr}</small>` : ''}</td></tr>`;
    }).join('') + `</tbody>`;

    `<button class="clear" data-scpage="-1"${sc.page ? '' : ' disabled'}>‹ Prev</button> ${sc.page + 1} / ${pages} ` +

$('scatter-view').addEventListener('change', e => {
  const t = e.target;
  if (t.matches('select[data-sc]')) { sc[t.dataset.sc] = t.value; sc[t.dataset.sc + 'a'] = false; sc.zoom = 1; sc.page = 0; drawScatter(); }
  else if (t.id === 'sc-preset' && t.value !== '') {
    const p = SC_PRESETS[+t.value]; sc.x = p[1]; sc.y = p[2]; sc.xa = !!p[3]; sc.ya = !!p[4]; sc.zoom = 1; t.value = ''; drawScatter();
  }
  else if (t.id === 'sc-conf') { sc.conf = t.value; sc.zoom = 1; sc.page = 0; drawScatter(); }
  else if (t.id === 'sc-fconf') { sc.focusConf = t.value; drawScatter(); }
  else if (t.id === 'sc-ming') { sc.minG = Math.max(0, +t.value || 0); sc.page = 0; drawScatter(); }
  else if (t.id === 'sc-fteam') { scAddFocus(t); }
});
function scAddFocus(input) {
  const name = teamByLower[input.value.trim().toLowerCase()];
  if (name && !sc.focus.includes(name)) { sc.focus.push(name); input.value = ''; drawScatter(); }
}
$('scatter-view').addEventListener('keydown', e => { if (e.target.id === 'sc-fteam' && e.key === 'Enter') { e.preventDefault(); scAddFocus(e.target); } });
$('scatter-view').addEventListener('input', e => { if (e.target.id === 'sc-q') { sc.q = e.target.value; sc.page = 0; drawScatter(); } });
$('scatter-view').addEventListener('click', e => {
  const a = e.target.closest('button[data-sca]');
  if (a && !a.disabled) { const [k, v] = a.dataset.sca.split(':'); sc[k + 'a'] = v === '1'; sc.zoom = 1; drawScatter(); return; }
  const tool = e.target.closest('[data-sctool]');
  if (tool) {
    const what = tool.dataset.sctool;
    if (what === 'flip') { [sc.x, sc.y, sc.xa, sc.ya] = [sc.y, sc.x, sc.ya, sc.xa]; }
    else if (what === 'logos') sc.logos = !sc.logos;
    else if (what === 'trend') sc.trend = !sc.trend;
    else if (what === 'random') { const pick = () => SC_METRICS[Math.floor(Math.random() * SC_METRICS.length)].id; sc.x = pick(); do { sc.y = pick(); } while (sc.y === sc.x); sc.xa = sc.ya = false; }
    else if (what === 'clearfocus') { sc.focus = []; sc.focusConf = ''; const f = $('sc-fconf'); if (f) f.value = ''; }
    else if (what === 'trap') { sc.trap = !sc.trap; if (sc.trap) { sc.x = 'pace'; sc.y = 'adj_n'; sc.xa = sc.ya = false; } }

    sc.zoom = 1;
    for (const b of document.querySelectorAll('[data-sctool="logos"]')) b.setAttribute('aria-pressed', String(sc.logos));
    for (const b of document.querySelectorAll('[data-sctool="trend"]')) b.setAttribute('aria-pressed', String(sc.trend));

function scShowTip(e) {
  const tip = $('sc-tip'), pt = e.target.closest('.pt');

  const t = teamByName[pt.dataset.scteam]; if (!t) return;
  const mx = SC_BY_ID[sc.x], my = SC_BY_ID[sc.y], rows = scShown().map(tt => ({ t: tt, x: scValue(mx, sc.xa, tt), y: scValue(my, sc.ya, tt) })).filter(r => r.x != null && r.y != null);

  tip.innerHTML = `<b>${esc(t.name)}</b><small>${esc(t.conf)} · ${t.w}-${t.l}</small>` +
    `<div class="row"><span>${esc(scLabel(mx, sc.xa))}</span><span>${esc(scFmt(mx, r.x))} <small>#${r.xr}</small></span></div>` +
    `<div class="row"><span>${esc(scLabel(my, sc.ya))}</span><span>${esc(scFmt(my, r.y))} <small>#${r.yr}</small></span></div>`;

$('scatter-view').addEventListener('mousemove', e => { if (!SC_TOUCH) scShowTip(e); });
$('scatter-view').addEventListener('mouseleave', () => { const tip = $('sc-tip'); if (tip) tip.hidden = true; });
// turning a phone or resizing the window redraws the chart for the new width
let scResize = null;
document.addEventListener('fullscreenchange', () => { if ($('sc-svg')) drawScatter(); });
document.addEventListener('keydown', e => {
  const card = $('sc-chartcard');
  if (e.key === 'Escape' && card && card.classList.contains('sc-max')) {

// The address decides what is on screen: "#team=Duke" is Duke's page, anything else is the tables
function route() {
  $('menu-spreads').hidden = !CURRENT_SEASON;
  // the tournament is simulated from how teams stood going in, so it stays on the pre-tournament page
  document.querySelector('#menu a[data-page="bracket"]').hidden = FULL_SEASON;
  const page = { '#sim': 'sim', '#scatter': 'scatter', '#bracket': FULL_SEASON ? 'stats' : 'bracket', '#guide': 'guide', '#spreads': CURRENT_SEASON ? 'spreads' : 'stats' }[location.hash] || 'stats';
  document.body.classList.toggle('guide-mode', page === 'guide');
  document.body.classList.toggle('scatter-mode', page === 'scatter');
  document.body.classList.toggle('sim-mode', page === 'sim');
  document.body.classList.toggle('bracket-mode', page === 'bracket');
  document.body.classList.toggle('spread-mode', page === 'spreads');
  for (const a of document.querySelectorAll('#menu a')) a.dataset.page === page ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current');
  if (page !== 'stats') {
    state.team = null; state.player = null;
    document.body.classList.remove('team-mode');
    page === 'sim' ? renderSim() : page === 'scatter' ? renderScatter() : page === 'bracket' ? renderBracket() : page === 'guide' ? renderGuide() : renderSpreads();
    window.scrollTo(0, 0);
    return;
  }
  const m = location.hash.match(/^#team=(.*)$/);
  const pm = location.hash.match(/^#player=([^|]*)\|(.*)$/);
  let name = null, player = null;
  try {
    name = m ? decodeURIComponent(m[1]) : null;
    if (pm) player = { team: decodeURIComponent(pm[1]), name: decodeURIComponent(pm[2]) };
  } catch (e) {}
  state.team = name && teamByName[name] ? name : null;
  state.player = player && teamByName[player.team] ? player : null;
  document.body.classList.toggle('team-mode', !!(state.team || state.player));
  if (state.team || state.player) {
    for (const b of document.querySelectorAll('.controls > .seg button')) b.setAttribute('aria-pressed', 'false');
    state.player ? renderPlayer() : renderTeam();
    window.scrollTo(0, 0);
  } else {
    setView(state.view);
  }
}
window.addEventListener('hashchange', route);
$('team-view').addEventListener('click', e => {
  const sortButton = e.target.closest('button[data-tsort]');
  if (sortButton) {
    const [kind, key] = sortButton.dataset.tsort.split(':');
    const sort = teamSort[kind];
    if (sort.key === key) sort.dir = -sort.dir;

  if (sideButton) { shotSide = sideButton.dataset.shotside; renderTeamShots(); return; }
  const teamTabButton = e.target.closest('button[data-ttab]');
  if (teamTabButton) { teamTab = teamTabButton.dataset.ttab; showTeamTab(); return; }
  const pick = e.target.closest('button[data-out]');
  if (pick) { outPlayers.has(pick.dataset.out) ? outPlayers.delete(pick.dataset.out) : outPlayers.add(pick.dataset.out); renderWithout(); return; }
  if (e.target.closest('button[data-out-clear]')) { outPlayers = new Set(); renderWithout(); return; }
  const withoutSide = e.target.closest('button[data-woside]');
  if (withoutSide) { withoutPlaySide = withoutSide.dataset.woside; renderWithoutPlays(); return; }
  const playerSide = e.target.closest('button[data-pside]');
  if (playerSide) { playerPlaySide = playerSide.dataset.pside; renderPlayerPlays(); return; }
  const viewButton = e.target.closest('button[data-shotview]');
  if (viewButton && state.player) {
    shotView = viewButton.dataset.shotview;
    const team = teamByName[state.player.team];

    return;
  }
  const quadTab = e.target.closest('button[data-qtab]');
  if (quadTab) { quadTable = quadTab.dataset.qtab; showQuadTable(); return; }

route();
